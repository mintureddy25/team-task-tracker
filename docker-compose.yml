# API-only stack — uses cloud MySQL (Aiven) + Redis Cloud from .env.
# No local DB/Redis containers needed. `docker compose up --build` and you're done.
# API runs on http://localhost:3000  |  Swagger at http://localhost:3000/docs

services:
  api:
    build: .
    container_name: ttt-api
    # Reads DATABASE_URL (Aiven), REDIS_URL (Redis Cloud), JWT secrets, CORS, etc. from .env
    env_file:
      - .env
    # The image is a production build (dev deps like pino-pretty omitted), so force prod mode
    # here regardless of NODE_ENV in .env (which is meant for local `npm run dev`).
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
    ports:
      - "3000:3000"
