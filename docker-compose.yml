# Self-contained stack for reviewers — `docker compose up --build` and you're done.
# Boots MySQL + Redis + the API with zero manual setup. No .env required.
# API runs on http://localhost:3000  |  Swagger at http://localhost:3000/docs
#
# (To run against your own cloud MySQL/Redis instead, use `npm run dev` with a
#  local .env — see "Local development" in the README.)

services:
  mysql:
    image: mysql:8.4
    container_name: ttt-mysql
    environment:
      MYSQL_DATABASE: tasktracker
      MYSQL_USER: taskuser
      MYSQL_PASSWORD: taskpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-utaskuser', '-ptaskpass']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: ttt-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    container_name: ttt-api
    # Wait for healthy DB + Redis so the first boot (prisma migrate deploy) is race-free.
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      # connection_limit pins the Prisma pool — the container can detect 0 CPUs and
      # otherwise default to a pool of 1, which times out under the board's parallel queries.
      DATABASE_URL: "mysql://taskuser:taskpass@mysql:3306/tasktracker?connection_limit=5&pool_timeout=20"
      REDIS_URL: "redis://redis:6379"
      JWT_ACCESS_SECRET: "docker-compose-access-secret-change-in-real-deploy-please"
      JWT_REFRESH_SECRET: "docker-compose-refresh-secret-change-in-real-deploy-please"
      JWT_ACCESS_TTL: "15m"
      JWT_REFRESH_TTL: "7d"
      CACHE_TTL_SECONDS: "60"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
    ports:
      - "3000:3000"

volumes:
  mysql_data:
